<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<title>Render lab</title>
<base href="../">
<style>
  body { margin: 16px; background: #d8d8d2; font: 14px system-ui; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  canvas { width: 100%; height: auto; display: block; box-shadow: 0 4px 16px #0003; }
  figcaption { padding: 4px 0; }
  figure { margin: 0; }
</style>
<input type="file" id="file" accept="image/*">
<div id="grid"></div>
<script type="module">
  import { loadRenderAssets, renderItem } from './js/core/render.js';
  import { loadImage } from './js/core/photo.js';

  const blank = { price: '', unit: '', weight: '', name: '', note: '', mode: 'standard', oldPrice: '', multiQty: '' };
  const samples = [
    ['sockel', 'rod', { price: '24,95', unit: '/kg', name: 'Citroner' }],
    ['kort', 'svart', { price: '129,95', name: 'Basmati ris', weight: '5 kg' }],
    ['signatur', 'gron', { price: '9,95', unit: '/kg', name: 'Bananer', note: 'Färska idag' }],
    ['signatur', 'svart', { price: '29,95', mode: 'kampanj', oldPrice: '39,95', unit: '/st', name: 'Kapya röd paprika' }],
    ['signatur', 'rod', { price: '1299,95', name: 'Olivolja Extra Virgin', weight: '5 L', mode: 'nyhet' }],
    ['sockel', 'gron', { price: '30', multiQty: '2', mode: 'nyhet', name: 'Kvisttomater', note: 'Klass 1' }],
    ['kort', 'rod', { price: '29,95', mode: 'kampanj', oldPrice: '39,95', unit: '/kg', name: 'Kapya röd paprika' }],
    ['sockel', 'svart', { price: '1299,95', mode: 'kampanj', oldPrice: '1499', name: 'Olivolja Extra Virgin 5 liter dunk' }],
    ['kort', 'gron', { price: '5', unit: '/st' }],
  ];

  // Stand-in "produce" photo until a real one is picked.
  function fakePhoto() {
    const c = document.createElement('canvas'); c.width = 1600; c.height = 1600;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 1600, 1600); bg.addColorStop(0, '#3a4a3f'); bg.addColorStop(1, '#1f2a24');
    g.fillStyle = bg; g.fillRect(0, 0, 1600, 1600);
    for (const [x, y, r] of [[420, 520, 300], [980, 430, 270], [1250, 900, 290], [640, 1050, 320], [1080, 1330, 250], [250, 1240, 260], [200, 200, 220], [1400, 250, 200]]) {
      g.save(); g.shadowColor = '#0009'; g.shadowBlur = 60; g.shadowOffsetY = 30;
      const k = g.createRadialGradient(x - r / 3, y - r / 3, r / 10, x, y, r);
      k.addColorStop(0, '#fff0a0'); k.addColorStop(0.5, '#f6c829'); k.addColorStop(1, '#c98f0a');
      g.fillStyle = k; g.beginPath(); g.ellipse(x, y, r, r * 0.92, 0.3, 0, 7); g.fill(); g.restore();
    }
    return c;
  }

  async function draw(photo) {
    const assets = await loadRenderAssets();
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    for (const [i, [template, colorway, fields]] of samples.entries()) {
      const figure = document.createElement('figure');
      const canvas = document.createElement('canvas');
      const layout = renderItem(canvas, { item: { fields: { ...blank, ...fields }, crop: { x: 0.5, y: 0.5, zoom: 1 } }, photo, colorway, template, assets });
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
      await fetch(`./dev/out/lab-${i + 1}-${template}-${colorway}.jpg`, { method: 'PUT', body: blob });
      const caption = document.createElement('figcaption');
      caption.textContent = `${template} · ${colorway} · int ${layout.price.intSize}px · ${layout.warnings.join(', ') || 'ok'}`;
      figure.append(canvas, caption);
      grid.append(figure);
    }
    document.title = 'done';
  }

  document.getElementById('file').addEventListener('change', async (e) => draw(await loadImage(e.target.files[0])));
  draw(fakePhoto());
</script>
</html>
